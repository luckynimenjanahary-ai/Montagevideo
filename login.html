<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <title>S'inscrire / Se Connecter</title>
</head>
<body>

    <h2>1. S'inscrire (Fisoratana anarana)</h2>
    <form id="registerForm">
        <input type="email" id="regEmail" placeholder="Email" required><br><br>
        <input type="password" id="regPassword" placeholder="Mot de passe" required><br><br>
        <button type="submit">S'inscrire</button>
    </form>

    <hr>

    <h2>2. Se Connecter (Fidirana)</h2>
    <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required><br><br>
        <input type="password" id="loginPassword" placeholder="Mot de passe" required><br><br>
        <button type="submit">Se connecter</button>
    </form>

    <script>
        // FISORATANA ANARANA
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            let users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Jerena raha efa misy ilay email
            if (users.find(u => u.email === email)) {
                alert("Efa misy mampiasa ity email ity!");
                return;
            }

            // Amorona user vaovao (Mbola tsy manana acces)
            const newUser = {
                email: email,
                password: password,
                acces: { debutant: false, extreme: false, pro: false }
            };

            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            alert("Tafiditra soa aman-tsara! Afaka se connecter amin'izay ianao.");
        });

        // FIDIRANA (LOGIN)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            // LOGIN SPECIAL HO AN'NY ADMIN
            if (email === "admin@gmail.com" && password === "admin123") {
                localStorage.setItem('currentUser', JSON.stringify({ email: email, isAdmin: true }));
                window.location.href = "admin.html";
                return;
            }

            let users = JSON.parse(localStorage.getItem('users')) || [];
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                alert("Miarahaba!");
                window.location.href = "index.html"; // Pejy lehibe
            } else {
                alert("Misy diso ny Email na Mot de passe!");
            }
        });
    </script>
</body>
</html>
